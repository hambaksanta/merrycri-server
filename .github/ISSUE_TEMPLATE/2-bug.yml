name: 버그 (FIX)
description: 앱이 죽거나 기대와 다르게 동작할 때
title: "FIX: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 생겼나
      placeholder: 라운지에서 광장으로 나왔는데 라운지 인원 수가 줄지 않는다
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 다시 만드는 방법
      placeholder: |
        1. AVD 두 대 실행
        2. 둘 다 라운지 입장
        3. 한 대만 '광장으로'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 원래 어떻게 돼야 하나
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logcat 에러 / 스크린샷
      description: Logcat 에서 빨간 줄(FATAL EXCEPTION 아래 몇 줄)을 붙여넣기
      render: text
  - type: input
    id: env
    attributes:
      label: 실행 환경
      placeholder: "Pixel 7 AVD, API 34, 온라인 모드"
